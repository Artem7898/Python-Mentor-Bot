name: Verify

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15"]
    defaults:
      run:
        working-directory: python-mentor-bot
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python-mentor-bot/requirements-dev.lock
      - name: Install locked development dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
      - name: Check dependencies
        run: python -m pip check
      - name: Check lint and formatting
        run: |
          ruff check .
          ruff format --check .
      - name: Test bot and validate curriculum
        run: python -B -m pytest -p no:cacheprovider
      - name: Audit runtime dependencies
        run: python -m pip_audit --strict --require-hashes --disable-pip -r requirements.lock

  secret-scan:
    name: Scan secrets and tracked deployment files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check tracked deployment files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import PurePosixPath
          from subprocess import check_output

          files = check_output(["git", "ls-files", "-z"]).decode().split("\0")
          blocked = []
          database_suffixes = (".db", ".sqlite", ".sqlite3")
          sidecars = tuple(
              f"{suffix}-{sidecar}"
              for suffix in database_suffixes
              for sidecar in ("journal", "shm", "wal")
          )
          for filename in filter(None, files):
              path = PurePosixPath(filename.lower())
              dotenv = path.name == ".env" or (
                  path.name.startswith(".env.") and path.name != ".env.example"
              )
              sqlite = path.suffix in database_suffixes or path.name.endswith(sidecars)
              if dotenv or sqlite:
                  blocked.append(repr(filename))
          if blocked:
              raise SystemExit("Deployment files tracked in Git:\n" + "\n".join(blocked))
          PY
      - name: Run Gitleaks with redacted output
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          gitleaks_dir="$(mktemp -d)"
          trap 'rm -rf "$gitleaks_dir"' EXIT
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --silent --show-error --location --proto '=https' --retry 3 \
            --output "$gitleaks_dir/$archive" "$release/$archive"
          (
            cd "$gitleaks_dir"
            printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
            tar -xzf "$archive" gitleaks
          )
          "$gitleaks_dir/gitleaks" git --no-banner --redact=100 --log-opts=--all .
